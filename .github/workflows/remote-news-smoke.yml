name: Remote news smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deployed-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait briefly for backend auto-deploy
        run: sleep 35
      - name: Probe deployed opaque news runtime
        run: node scripts/remote_news_smoke.mjs
