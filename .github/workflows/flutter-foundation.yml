name: Flutter foundation

on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-foundation.yml'
      - '.github/workflows/release-triplet.yml'
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-foundation.yml'
      - '.github/workflows/release-triplet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform scaffolding without touching existing web
        working-directory: flutter_app
        run: flutter create --platforms=android,ios --org com.alqahtani --project-name al_qahtani .
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test mobile/default runtime
        working-directory: flutter_app
        run: flutter test
      - name: Test Android TV runtime define
        working-directory: flutter_app
        run: flutter test --dart-define=AL_QAHTANI_TARGET=tv

  android-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read expected version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/{print $2}' flutter_app/pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          test -n "$VERSION" && test -n "$BUILD" && test "$RAW" != "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Create Android scaffold
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.alqahtani --project-name al_qahtani .
      - name: Build mobile APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=AL_QAHTANI_TARGET=mobile
      - name: Verify mobile APK identity and signature
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APK=flutter_app/build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -s "$APK"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.alqahtani.al_qahtani'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$EXPECTED_BUILD'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$EXPECTED_VERSION'"
      - name: Stage mobile APK and checksum
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Al-Qahtani-Mobile.apk
          sha256sum Al-Qahtani-Mobile.apk > Al-Qahtani-Mobile.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Qahtani-Mobile-APK
          path: |
            Al-Qahtani-Mobile.apk
            Al-Qahtani-Mobile.apk.sha256
          if-no-files-found: error

  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read expected version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/{print $2}' flutter_app/pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          test -n "$VERSION" && test -n "$BUILD" && test "$RAW" != "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Create Android scaffold
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.alqahtani --project-name al_qahtani .
      - name: Configure Android TV manifest
        shell: python
        run: |
          from pathlib import Path
          p = Path('flutter_app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>')
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-feature android:name="android.software.leanback" android:required="true" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />')
          p.write_text(s)
      - name: Verify TV source requirements
        run: |
          grep -q 'LEANBACK_LAUNCHER' flutter_app/android/app/src/main/AndroidManifest.xml
          grep -q 'android.software.leanback.*true' flutter_app/android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen.*false' flutter_app/android/app/src/main/AndroidManifest.xml
          grep -q 'NavigationRail' flutter_app/lib/main.dart
          grep -q 'AL_QAHTANI_TARGET' flutter_app/lib/src/app_target.dart
      - name: Build TV APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=AL_QAHTANI_TARGET=tv
      - name: Verify TV APK identity, signature and packaged features
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APK=flutter_app/build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -s "$APK"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.alqahtani.al_qahtani'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$EXPECTED_BUILD'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$EXPECTED_VERSION'"
          printf '%s\n' "$BADGING" | grep -q "android.software.leanback"
          printf '%s\n' "$BADGING" | grep -q "android.hardware.touchscreen"
      - name: Stage TV APK and checksum
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Al-Qahtani-TV.apk
          sha256sum Al-Qahtani-TV.apk > Al-Qahtani-TV.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Qahtani-TV-APK
          path: |
            Al-Qahtani-TV.apk
            Al-Qahtani-TV.apk.sha256
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read expected version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/{print $2}' flutter_app/pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          test -n "$VERSION" && test -n "$BUILD" && test "$RAW" != "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Create iOS scaffold
        working-directory: flutter_app
        run: flutter create --platforms=ios --org com.alqahtani --project-name al_qahtani .
      - name: Build iOS without codesign
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign --dart-define=AL_QAHTANI_TARGET=ios
      - name: Verify iOS bundle is explicitly unsigned
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APP=flutter_app/build/ios/iphoneos/Runner.app
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test ! -e "$APP/embedded.mobileprovision"
          test ! -d "$APP/_CodeSignature"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.alqahtani.alQahtani'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$EXPECTED_BUILD"
      - name: Package UNSIGNED IPA and checksum
        run: |
          mkdir -p Payload
          cp -R flutter_app/build/ios/iphoneos/Runner.app Payload/
          zip -qry Al-Qahtani-UNSIGNED.ipa Payload
          test -s Al-Qahtani-UNSIGNED.ipa
          shasum -a 256 Al-Qahtani-UNSIGNED.ipa > Al-Qahtani-UNSIGNED.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Qahtani-iOS-UNSIGNED-IPA
          path: |
            Al-Qahtani-UNSIGNED.ipa
            Al-Qahtani-UNSIGNED.ipa.sha256
          if-no-files-found: error
