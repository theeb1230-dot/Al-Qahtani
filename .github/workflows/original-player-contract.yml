name: Original Basri player contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  original-player-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect original Basri player behavior
        run: python scripts/original_player_contract.py
