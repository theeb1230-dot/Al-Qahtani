name: Release Flutter triplet

on:
  workflow_run:
    workflows: ['Flutter foundation']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify and bind exact successful Flutter run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          RUN_NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .name)"
          EVENT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .event)"
          BRANCH="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .head_branch)"
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .status)"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .conclusion)"
          RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq .head_sha)"
          test "$RUN_NAME" = "Flutter foundation"
          test "$EVENT" = "push"
          test "$BRANCH" = "main"
          test "$STATUS" = "completed"
          test "$CONCLUSION" = "success"
          test "$RUN_SHA" = "$TRIGGER_SHA"
          echo "source_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$TRIGGER_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$TRIGGER_RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          RAW="$(awk '/^version:/{print $2}' flutter_app/pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          test -n "$VERSION" && test -n "$BUILD" && test "$RAW" != "$VERSION"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$EXISTING_TARGET" = "$SOURCE_SHA" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists on exact release commit $SOURCE_SHA."
              exit 0
            fi
            if git diff --quiet "$EXISTING_TARGET" "$SOURCE_SHA" -- . ':(exclude).github/**' ':(exclude)docs/**'; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists and product tree is unchanged between $EXISTING_TARGET and $SOURCE_SHA."
              exit 0
            fi
            echo "Release $TAG exists on $EXISTING_TARGET but product files changed without a version bump." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Wait for protected Web and runtime gates on exact release commit
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          required = {
              'Deploy GitHub Pages', 'Web smoke', 'Mobile WebKit smoke',
              'Content runtime', 'Remote runtime smoke',
              'Remote movie playback smoke', 'Remote news smoke',
              'Live provider smoke', 'Original Basri download contract',
              'Original Basri player contract', 'Independent download resolution',
              'Match runtime', 'Remote CORS smoke', 'CORS boundary',
              'Media reference expiry', 'Trusted download filename',
          }
          sha = os.environ['SOURCE_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          for _ in range(36):
              raw = subprocess.check_output([
                  'gh', 'run', 'list', '--repo', repo, '--commit', sha,
                  '--limit', '100', '--json', 'name,status,conclusion,databaseId'
              ], text=True)
              runs = json.loads(raw)
              by_name = {}
              for run in runs:
                  by_name.setdefault(run['name'], []).append(run)
              missing, pending, failed = [], [], []
              for name in sorted(required):
                  candidates = by_name.get(name, [])
                  if not candidates:
                      missing.append(name)
                      continue
                  if any(r['status'] == 'completed' and r['conclusion'] == 'success' for r in candidates):
                      continue
                  if any(r['status'] != 'completed' for r in candidates):
                      pending.append(name)
                      continue
                  latest = max(candidates, key=lambda r: r['databaseId'])
                  failed.append(f"{name}:{latest['conclusion']}")
              if failed:
                  raise SystemExit('Protected gate failure(s) with no successful rerun: ' + ', '.join(failed))
              if not missing and not pending:
                  print('All protected gates are green on exact release commit', sha)
                  break
              print('Waiting. Missing:', missing, 'Pending:', pending)
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for protected exact-release gates')
          PY

      - name: Download exact-run Mobile, TV and iOS artifacts
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-input/mobile release-input/tv release-input/ios release
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'Al-Qahtani-Mobile-APK' --dir release-input/mobile
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'Al-Qahtani-TV-APK' --dir release-input/tv
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'Al-Qahtani-iOS-UNSIGNED-IPA' --dir release-input/ios
          test -s release-input/mobile/Al-Qahtani-Mobile.apk
          test -s release-input/tv/Al-Qahtani-TV.apk
          test -s release-input/ios/Al-Qahtani-UNSIGNED.ipa
          (cd release-input/mobile && sha256sum -c Al-Qahtani-Mobile.apk.sha256)
          (cd release-input/tv && sha256sum -c Al-Qahtani-TV.apk.sha256)
          (cd release-input/ios && sha256sum -c Al-Qahtani-UNSIGNED.ipa.sha256)

      - name: Stage release assets and provenance
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          cp release-input/mobile/Al-Qahtani-Mobile.apk "release/Al-Qahtani-Mobile-v${VERSION}.apk"
          cp release-input/tv/Al-Qahtani-TV.apk "release/Al-Qahtani-TV-v${VERSION}.apk"
          cp release-input/ios/Al-Qahtani-UNSIGNED.ipa "release/Al-Qahtani-iOS-v${VERSION}-UNSIGNED.ipa"
          (cd release && sha256sum *.apk *.ipa > SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['SOURCE_SHA'],
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'version': os.environ['VERSION'],
              'build': os.environ['BUILD'],
              'web': {'delivery': 'GitHub Pages', 'release_asset': False},
              'android_mobile': {'asset': f"Al-Qahtani-Mobile-v{os.environ['VERSION']}.apk"},
              'android_tv': {'asset': f"Al-Qahtani-TV-v{os.environ['VERSION']}.apk", 'leanback_required': True},
              'ios': {'asset': f"Al-Qahtani-iOS-v{os.environ['VERSION']}-UNSIGNED.ipa", 'signed': False, 'install_note': 'External signing/provisioning is required.'},
          }
          Path('release/PROVENANCE.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          cat > release-notes.md <<EOF
          ## Al-Qahtani v${VERSION} (${BUILD})

          Four-surface product update from commit \`${SOURCE_SHA}\`.

          - Web/PWA remains deployed on GitHub Pages and is not replaced by Flutter Web.
          - Android Mobile APK is included below.
          - Android TV APK is included below with LEANBACK/remote requirements verified by CI.
          - iOS IPA is explicitly **UNSIGNED / no-codesign** and requires external signing/provisioning before installation.
          - SHA-256 values are in \`SHA256SUMS.txt\`.
          - Provenance is recorded in \`PROVENANCE.json\`.
          EOF

      - name: Publish complete GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Al-Qahtani v${VERSION}" --notes-file release-notes.md \
            release/Al-Qahtani-Mobile-v${VERSION}.apk \
            release/Al-Qahtani-TV-v${VERSION}.apk \
            release/Al-Qahtani-iOS-v${VERSION}-UNSIGNED.ipa \
            release/SHA256SUMS.txt release/PROVENANCE.json

      - name: Verify published Release is complete
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets > release-view.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('release-view.json'))
          expected = {
              f"Al-Qahtani-Mobile-v{os.environ['VERSION']}.apk",
              f"Al-Qahtani-TV-v{os.environ['VERSION']}.apk",
              f"Al-Qahtani-iOS-v{os.environ['VERSION']}-UNSIGNED.ipa",
              'SHA256SUMS.txt', 'PROVENANCE.json',
          }
          if data.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit(f"Release target mismatch: {data.get('targetCommitish')} != {os.environ['SOURCE_SHA']}")
          actual = {a['name'] for a in data['assets'] if a.get('size', 0) > 0}
          missing = expected - actual
          if missing:
              raise SystemExit('Incomplete Release: ' + ', '.join(sorted(missing)))
          print('Release verified:', ', '.join(sorted(expected)))
          PY
