<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>مشغل الويب</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2c;--muted:#8ea3b9;--accent:#168aff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:16px}.shell{width:min(1100px,100%)}.player{aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 18px 60px #0008}.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;background:var(--panel);border-radius:14px}.status{color:var(--muted);font-size:14px}.servers{display:flex;gap:8px;flex-wrap:wrap}.servers button{border:0;border-radius:10px;background:#16263a;color:#fff;padding:9px 12px;cursor:pointer}.servers button.active{background:var(--accent)}.error{padding:28px;text-align:center;color:#ffd3d3}
</style>
</head>
<body>
<main class="shell">
  <div id="player" class="player"><div class="error">اختر مصدر تشغيل صالح.</div></div>
  <div class="bar"><div id="status" class="status">جاهز</div><div id="servers" class="servers"></div></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const player=document.getElementById('player');
const statusEl=document.getElementById('status');
const serversEl=document.getElementById('servers');
let hls=null;
let transientObjectUrl='';
let playGeneration=0;
const MPEG_TS_PACKET_SIZE=188;
const MPEG_TS_PCR_WRAP=8589934592;
const MPEG_TS_DURATION_PROBE_BYTES=262144;

function b64uDecode(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function extractLegacyIntent(intent){
  try{
    const q=intent.match(/[?&]data=([^#&]+)/);
    if(!q)return null;
    return JSON.parse(b64uDecode(decodeURIComponent(q[1])));
  }catch(e){
    console.warn('Legacy intent decode failed',e);
    return null;
  }
}

function normalizeServer(x={}){
  const url=String(x.url||x.src||'').trim();
  let type=String(x.type||'').toLowerCase();
  if(!type&&/\.m3u8(?:$|\?)/i.test(url))type='m3u8';
  else if(!type&&/\.mp4(?:$|\?)/i.test(url))type='mp4';
  else if(!type)type='embed';
  return {name:String(x.name||'سيرفر'),url,type};
}

function collectSources(){
  const direct=params.get('url')||params.get('src');
  if(direct)return [normalizeServer({name:'السيرفر الرئيسي',url:direct,type:params.get('type')||''})];
  const intent=params.get('intent');
  if(!intent)return [];
  const payload=extractLegacyIntent(intent);
  if(!payload)return [];
  const list=Array.isArray(payload.servers)?[...payload.servers]:[];
  if(payload.url)list.unshift({name:'السيرفر الرئيسي',url:payload.url,type:payload.type});
  return list.map(normalizeServer).filter(s=>s.url);
}

function stop(){
  playGeneration++;
  if(hls){hls.destroy();hls=null}
  if(transientObjectUrl){URL.revokeObjectURL(transientObjectUrl);transientObjectUrl=''}
  player.innerHTML='';
}

function createVideo(){
  const v=document.createElement('video');
  v.controls=true;
  v.playsInline=true;
  v.autoplay=true;
  v.preload='metadata';
  v.setAttribute('webkit-playsinline','');
  return v;
}

function bindVideoStatus(v,source){
  v.addEventListener('playing',()=>{statusEl.textContent='يعمل الآن: '+source.name;},{once:true});
  v.addEventListener('error',()=>{
    const code=v.error?.code||0;
    const labels={1:'تم إيقاف التحميل',2:'خطأ في الشبكة',3:'تعذر فك ترميز الفيديو',4:'صيغة الفيديو غير مدعومة'};
    statusEl.textContent=(labels[code]||'تعذر تشغيل الفيديو')+' — '+source.name;
  });
}

function bytesLookLikeMp4(bytes){
  return bytes.length>=12&&String.fromCharCode(...bytes.slice(4,8))==='ftyp';
}

function bytesLookLikeMatroska(bytes){
  return bytes.length>=4&&bytes[0]===0x1a&&bytes[1]===0x45&&bytes[2]===0xdf&&bytes[3]===0xa3;
}

function bytesLookLikeMpegTs(bytes){
  if(bytes.length<188)return false;
  for(let sync=0;sync<Math.min(188,bytes.length);sync++){
    if(bytes[sync]!==0x47)continue;
    if(sync+188>=bytes.length||bytes[sync+188]===0x47)return true;
  }
  return false;
}

function bytesLookLikeHls(bytes){
  try{return new TextDecoder().decode(bytes.slice(0,64)).trimStart().startsWith('#EXTM3U')}catch{return false}
}

function totalBytesFromContentRange(value=''){
  const match=String(value).match(/\/\s*(\d+)\s*$/);
  const total=Number(match?.[1]||0);
  return Number.isSafeInteger(total)&&total>0?total:0;
}

async function inspectStream(url){
  const response=await fetch(url,{headers:{Range:'bytes=0-4095'},cache:'no-store'});
  if(!response.ok&&response.status!==206)throw new Error('STREAM_PROBE_'+response.status);
  const contentType=String(response.headers.get('content-type')||'').toLowerCase();
  const totalBytes=totalBytesFromContentRange(response.headers.get('content-range')||'')||Number(response.headers.get('content-length')||0)||0;
  const bytes=new Uint8Array(await response.arrayBuffer());
  const mp4=bytesLookLikeMp4(bytes)||contentType.includes('video/mp4');
  const matroska=bytesLookLikeMatroska(bytes)||contentType.includes('matroska')||contentType.includes('webm');
  const mpegTs=bytesLookLikeMpegTs(bytes)||contentType.includes('video/mp2t');
  const hls=bytesLookLikeHls(bytes)||contentType.includes('mpegurl');
  return {contentType,totalBytes,mp4,matroska,mpegTs,hls};
}

function findTsSync(bytes){
  for(let offset=0;offset<Math.min(MPEG_TS_PACKET_SIZE,bytes.length);offset++){
    if(bytes[offset]!==0x47)continue;
    if(offset+MPEG_TS_PACKET_SIZE>=bytes.length||bytes[offset+MPEG_TS_PACKET_SIZE]===0x47)return offset;
  }
  return -1;
}

function extractPcrSamples(bytes,fileOffset=0){
  const samples=[];
  const sync=findTsSync(bytes);
  if(sync<0)return samples;
  for(let pos=sync;pos+MPEG_TS_PACKET_SIZE<=bytes.length;pos+=MPEG_TS_PACKET_SIZE){
    if(bytes[pos]!==0x47)continue;
    const pid=((bytes[pos+1]&0x1f)<<8)|bytes[pos+2];
    const adaptationControl=(bytes[pos+3]>>4)&0x03;
    if(adaptationControl!==2&&adaptationControl!==3)continue;
    const adaptationLength=bytes[pos+4];
    if(adaptationLength<7||pos+5+adaptationLength>bytes.length)continue;
    const flags=bytes[pos+5];
    if((flags&0x10)===0)continue;
    const b0=bytes[pos+6],b1=bytes[pos+7],b2=bytes[pos+8],b3=bytes[pos+9],b4=bytes[pos+10];
    const base=b0*33554432+b1*131072+b2*512+b3*2+(b4>>7);
    samples.push({pid,base,offset:fileOffset+pos});
  }
  return samples;
}

function pcrDeltaSeconds(first,last){
  let ticks=last-first;
  if(ticks<0)ticks+=MPEG_TS_PCR_WRAP;
  return ticks/90000;
}

function durationFromPcrSamples(firstSamples,lastSamples,totalBytes){
  const durations=[];
  const firstByPid=new Map();
  for(const sample of firstSamples)if(!firstByPid.has(sample.pid))firstByPid.set(sample.pid,sample);
  for(const last of [...lastSamples].reverse()){
    const first=firstByPid.get(last.pid);
    if(!first)continue;
    const seconds=pcrDeltaSeconds(first.base,last.base);
    if(Number.isFinite(seconds)&&seconds>=1&&seconds<=86400)durations.push(seconds);
  }
  if(durations.length)return Math.max(...durations);

  const byPid=new Map();
  for(const sample of firstSamples){
    if(!byPid.has(sample.pid))byPid.set(sample.pid,[]);
    byPid.get(sample.pid).push(sample);
  }
  for(const samples of byPid.values()){
    if(samples.length<2)continue;
    const first=samples[0],last=samples[samples.length-1];
    const seconds=pcrDeltaSeconds(first.base,last.base);
    const bytes=last.offset-first.offset;
    if(seconds<0.25||bytes<=0)continue;
    const bytesPerSecond=bytes/seconds;
    const estimate=totalBytes/bytesPerSecond;
    if(Number.isFinite(estimate)&&estimate>=1&&estimate<=86400)durations.push(estimate);
  }
  return durations.length?Math.max(...durations):0;
}

async function fetchRange(url,start,end){
  const response=await fetch(url,{headers:{Range:`bytes=${start}-${end}`},cache:'no-store'});
  if(!response.ok&&response.status!==206)throw new Error('TS_DURATION_PROBE_'+response.status);
  const range=String(response.headers.get('content-range')||'');
  const match=range.match(/bytes\s+(\d+)-(\d+)\/(\d+|\*)/i);
  const actualStart=Number(match?.[1]??start);
  const total=match?.[3]&&match[3]!=='*'?Number(match[3]):0;
  return {bytes:new Uint8Array(await response.arrayBuffer()),start:actualStart,total};
}

async function estimateMpegTsDuration(url,knownTotalBytes=0){
  let first;
  try{
    first=await fetchRange(url,0,MPEG_TS_DURATION_PROBE_BYTES-1);
  }catch(e){
    console.warn('MPEG-TS first duration probe failed',e);
    return 0;
  }
  const totalBytes=knownTotalBytes||first.total||0;
  const firstSamples=extractPcrSamples(first.bytes,first.start);
  if(!totalBytes)return durationFromPcrSamples(firstSamples,[],first.bytes.length);
  const tailStart=Math.max(0,totalBytes-MPEG_TS_DURATION_PROBE_BYTES);
  let tailSamples=[];
  if(tailStart>0){
    try{
      const tail=await fetchRange(url,tailStart,totalBytes-1);
      tailSamples=extractPcrSamples(tail.bytes,tail.start);
    }catch(e){
      console.warn('MPEG-TS tail duration probe failed',e);
    }
  }
  return durationFromPcrSamples(firstSamples,tailSamples,totalBytes);
}

function playHls(source){
  const v=createVideo();
  bindVideoStatus(v,source);
  player.appendChild(v);
  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=source.url;
  }else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true});
    hls.loadSource(source.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)statusEl.textContent='تعذر تشغيل البث';});
  }else{
    v.src=source.url;
  }
  v.play().catch(()=>{});
}

function playMpegTsAsHls(source,durationSeconds){
  const duration=Number(durationSeconds);
  if(!Number.isFinite(duration)||duration<1){
    statusEl.textContent='تم التحقق من MPEG-TS، لكن المصدر لا يوفر توقيتًا موثوقًا للمدة؛ تعذر بناء تشغيل HLS دون مدة وهمية.';
    const v=createVideo();
    bindVideoStatus(v,source);
    player.appendChild(v);
    v.src=source.url;
    v.play().catch(()=>{});
    return;
  }
  const segmentUrl=new URL(source.url,location.href).href;
  const extinf=Math.max(1,Math.round(duration*1000)/1000);
  const targetDuration=Math.max(1,Math.ceil(extinf));
  const manifest=[
    '#EXTM3U',
    '#EXT-X-VERSION:3',
    '#EXT-X-PLAYLIST-TYPE:VOD',
    '#EXT-X-TARGETDURATION:'+targetDuration,
    '#EXT-X-MEDIA-SEQUENCE:0',
    '#EXTINF:'+extinf.toFixed(3)+',',
    segmentUrl,
    '#EXT-X-ENDLIST',
    '',
  ].join('\n');
  transientObjectUrl=URL.createObjectURL(new Blob([manifest],{type:'application/vnd.apple.mpegurl'}));
  statusEl.textContent='تم التحقق من MPEG-TS وحساب مدة المصدر — جارٍ تشغيله عبر HLS المتوافق مع Safari';
  playHls({...source,url:transientObjectUrl,type:'m3u8'});
}

async function playDirectStream(source,generation){
  let inspection=null;
  try{
    inspection=await inspectStream(source.url);
  }catch(e){
    console.warn('Stream preflight failed',e);
  }
  if(generation!==playGeneration)return;
  if(inspection?.hls){
    playHls({...source,type:'m3u8'});
    return;
  }
  if(inspection?.mpegTs){
    statusEl.textContent='تم التحقق من MPEG-TS — جارٍ قراءة توقيت المصدر';
    const duration=await estimateMpegTsDuration(source.url,inspection.totalBytes);
    if(generation!==playGeneration)return;
    playMpegTsAsHls(source,duration);
    return;
  }
  const v=createVideo();
  bindVideoStatus(v,source);
  player.appendChild(v);
  const src=document.createElement('source');
  src.src=source.url;
  if(inspection?.mp4)src.type='video/mp4';
  v.appendChild(src);
  v.load();
  if(inspection?.matroska){
    statusEl.textContent='المصدر بصيغة Matroska/WebM وغير مدعوم مباشرة في Safari؛ جارٍ تجربة التشغيل المتاح';
  }else if(inspection?.mp4){
    statusEl.textContent='تم التحقق من MP4 — جارٍ التشغيل';
  }else if(inspection?.contentType){
    statusEl.textContent='جارٍ التشغيل ('+inspection.contentType+')';
  }
  v.play().catch(()=>{});
}

function play(source){
  stop();
  const generation=playGeneration;
  statusEl.textContent='جارٍ تشغيل '+source.name;
  document.querySelectorAll('.servers button').forEach(b=>b.classList.toggle('active',b.dataset.url===source.url));
  if(source.type==='m3u8'){
    playHls(source);
  }else if(source.type==='mp4'||source.type==='stream'){
    playDirectStream(source,generation);
  }else{
    const f=document.createElement('iframe');f.src=source.url;f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='no-referrer';player.appendChild(f);
  }
}

const sources=collectSources();
if(!sources.length){
  statusEl.textContent='لم يصل رابط تشغيل صالح';
}else{
  serversEl.innerHTML='';
  sources.forEach((s,i)=>{
    const b=document.createElement('button');b.textContent=s.name;b.dataset.url=s.url;b.onclick=()=>play(s);serversEl.appendChild(b);
    if(i===0)play(s);
  });
}
</script>
</body>
</html>
