<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b"><title>القحطاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#151515;--panel2:#1b1b1b;--text:#f7f1e5;--muted:#aaa08e;--gold:#d8aa4f;--gold2:#f1d38e;--line:#d8aa4f30;--danger:#ff7680}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% -20%,#49351440 0,transparent 34%),var(--bg);color:var(--text);font-family:Cairo,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#09090bee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:auto;padding:16px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brandmark{display:flex;align-items:center;gap:10px}.qaf{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid #d8aa4f60;background:#120f09;color:var(--gold);font-size:27px;font-weight:800}.brand strong{font-size:1.12rem;color:var(--gold2)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;background:var(--panel);border:1px solid #ffffff0e;padding:8px 11px;border-radius:10px;font-size:.85rem}.nav a[aria-current="page"]{border-color:var(--line);color:var(--gold2)}
.hero{padding:28px 0 14px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,6vw,2.7rem);color:var(--gold2)}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;gap:12px}.card{background:linear-gradient(145deg,#ffffff05,#0000),var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px;display:grid;grid-template-columns:1fr 122px 1fr;align-items:center;gap:8px;cursor:pointer;transition:.16s transform,.16s border-color}.card:active{transform:scale(.992)}.card:hover{border-color:#d8aa4f66}
.team{text-align:center;min-width:0}.team-logo-wrap{width:66px;height:66px;margin:0 auto;display:grid;place-items:center;border-radius:50%;background:#202020;border:1px solid #d8aa4f25;overflow:hidden}.team-logo-wrap>img,.team-logo-wrap>.team-logo-missing{grid-area:1/1}.team img{width:54px;height:54px;object-fit:contain;display:block}.team-logo-missing{width:31px;height:31px;color:#9c783a}.team b{display:block;margin-top:7px;overflow:hidden;text-overflow:ellipsis}.center{text-align:center}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#ffffff0b;color:var(--muted);font-size:.75rem}.live{color:#ff8b96}.time{font-weight:800;font-size:1.1rem;margin-top:8px}.competition{font-size:.7rem;color:#8e8678;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:18px}.retry{margin-top:12px;border:0;background:var(--gold);color:#181004;padding:10px 14px;border-radius:10px;font-weight:800}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:20;max-width:min(92vw,480px);padding:11px 16px;border:1px solid var(--line);background:#17130d;color:#fff;border-radius:12px;box-shadow:0 12px 40px #0008;display:none;text-align:center}
@media(max-width:620px){.brand{align-items:flex-start;flex-direction:column}.nav{width:100%}.card{grid-template-columns:1fr 96px 1fr}.team-logo-wrap{width:56px;height:56px}.team img{width:46px;height:46px}.team b{font-size:.84rem}.time{font-size:1rem}}
</style>
</head>
<body>
<header><div class="wrap brand"><div class="brandmark"><span class="qaf">ق</span><strong>القحطاني</strong></div><nav class="nav"><a aria-current="page" href="./">المباريات</a><a href="albasri-cinema.html">الأفلام والمسلسلات</a><a href="news.html">الأخبار</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>مباريات اليوم</h1><p>النتائج والبث بتوقيت السعودية، دون روابط خارجية مكشوفة.</p></section>
<div id="list" class="grid"><div class="state">جارٍ تحميل المباريات…</div></div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">
import { getMatches } from './web/core/api-client.js';
import { formatSaudiMatchTime, hasSaudiMatchTimePassed } from './web/core/match-time.js';
const list=document.getElementById('list'),toastEl=document.getElementById('toast');
const BACKEND='https://al-qahtani-api.onrender.com';
const BASRI_ORIGIN='https://www.albasritv.abrdns.com/';
const cleanImg=u=>{
 if(!u)return '';
 try{
   const raw=String(u).trim();
   const absolute=/^https?:\/\//i.test(raw)||raw.startsWith('//');
   const url=new URL(raw,absolute?location.href:BASRI_ORIGIN);
   if(url.protocol==='http:')url.protocol='https:';
   if(url.protocol!=='https:')return '';
   if(['kooorracity.com','www.kooorracity.com'].includes(url.hostname.toLowerCase())&&url.pathname.startsWith('/wp-content/uploads/'))return BACKEND+'/api/matches/logo?url='+encodeURIComponent(url.href);
   return url.href;
 }catch{return ''}
};
let toastTimer;function toast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.style.display='block';toastTimer=setTimeout(()=>toastEl.style.display='none',3200)}
function logoCandidates(match,side){
 const team=match?.[side]||{};const prefix=side==='team1'?'home':'away';
 const values=[team.logo,team.logo_url,team.logoUrl,team.image,team.img,team.icon,team.badge,team.crest,team.photo,team.avatar,match?.[side+'_logo'],match?.[side+'Logo'],match?.[prefix+'_logo'],match?.[prefix+'Logo'],match?.[prefix+'TeamLogo']];
 return [...new Set(values.map(cleanImg).filter(Boolean))];
}
function makeLogoPlaceholder(){
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 64 64');svg.setAttribute('aria-hidden','true');svg.classList.add('team-logo-missing');
 const shield=document.createElementNS(ns,'path');shield.setAttribute('d','M32 4 52 11v17c0 13-8.4 24.6-20 31C20.4 52.6 12 41 12 28V11L32 4Z');shield.setAttribute('fill','none');shield.setAttribute('stroke','currentColor');shield.setAttribute('stroke-width','4');svg.append(shield);return svg;
}
function renderTeam(match,side){
 const team=match?.[side]||{},box=document.createElement('div');box.className='team';const logoWrap=document.createElement('div');logoWrap.className='team-logo-wrap';const fallback=makeLogoPlaceholder();logoWrap.appendChild(fallback);const candidates=logoCandidates(match,side);
 if(candidates.length){const img=document.createElement('img');img.alt=team.name?`شعار ${team.name}`:'شعار الفريق';img.loading='lazy';img.decoding='async';let index=0;const tryNext=()=>{if(index>=candidates.length){img.remove();fallback.hidden=false;return}fallback.hidden=true;img.src=candidates[index++]};img.addEventListener('error',tryNext);img.addEventListener('load',()=>{fallback.hidden=true});logoWrap.appendChild(img);tryNext()}
 const name=document.createElement('b');name.textContent=String(team.name||'');box.append(logoWrap,name);return box;
}
function numericScore(value){if(value===null||value===undefined||String(value).trim()==='')return null;const n=Number(value);return Number.isFinite(n)?Math.trunc(n):null}
function scoreText(m){const a=numericScore(m.team1?.goals),b=numericScore(m.team2?.goals);return a===null||b===null?null:`${a} - ${b}`}
function card(m){
 const d=document.createElement('div');d.className='card';d.tabIndex=0;d.setAttribute('role','button');
 const live=m.status==='live'||m.priority===1,ended=m.status==='ended'||m.priority===3,scheduledStarted=!live&&!ended&&hasSaudiMatchTimePassed(m.time);const label=live?'جاري الآن':ended?'انتهت':scheduledStarted?'موعدها بدأ — بانتظار البث':'لم تبدأ';const score=scoreText(m);const centerText=live||ended?(score||'النتيجة غير متاحة'):formatSaudiMatchTime(m.time);
 const center=document.createElement('div');center.className='center';const pill=document.createElement('span');pill.className='pill'+(live?' live':'');pill.textContent=label;const time=document.createElement('div');time.className='time';time.textContent=centerText;center.append(pill,time);if(m.competition){const c=document.createElement('div');c.className='competition';c.textContent=m.competition;center.append(c)}d.append(renderTeam(m,'team1'),center,renderTeam(m,'team2'));d.onclick=()=>openMatch(m);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMatch(m)}};return d;
}
function openMatch(m){
 const ended=m.status==='ended'||m.priority===3;if(ended){toast('المباراة انتهت ولا يوجد بث مباشر الآن.');return}const ref=String(m.ref||m.link||'').trim();if(!ref){toast('مرجع تشغيل المباراة غير متاح حاليًا.');return}location.href='match-player.html?match='+encodeURIComponent(ref);
}
async function load(){
 list.innerHTML='<div class="state">جارٍ تحميل المباريات…</div>';
 try{const result=await getMatches(),j=result.data;if(!j||j.status!=='success'||!Array.isArray(j.data))throw new Error('payload');list.innerHTML='';if(!j.data.length){list.innerHTML='<div class="state">لا توجد مباريات اليوم.</div>';return}j.data.forEach(m=>list.appendChild(card(m)))}catch(e){list.innerHTML='<div class="state">تعذر جلب المباريات حاليًا.<br><button id="retryMatches" class="retry">إعادة المحاولة</button></div>';document.getElementById('retryMatches')?.addEventListener('click',load)}
}
load();setInterval(load,45000);
</script>
</body>
</html>
