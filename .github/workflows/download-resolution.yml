name: Independent download resolution

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/download_resolution_test.mjs'
      - '.github/workflows/download-resolution.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/download_resolution_test.mjs'
      - '.github/workflows/download-resolution.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/download_resolution_test.mjs
