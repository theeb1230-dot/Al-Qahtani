<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>مشاهدة المباراة | القحطاني TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#172235;--gold:#c6974c;--gold2:#e2be79;--muted:#aeb6c2;--line:#c6974c45;--danger:#ff8089}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -20%,#6d4d2535,transparent 35%),var(--bg);color:#f8f3e9;font-family:Tahoma,Arial,sans-serif;padding:16px}.shell{width:min(1050px,100%);margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.brand strong{color:var(--gold2);font-size:1.1rem;display:flex;gap:9px;align-items:center}.mark{position:relative;width:34px;height:34px;border:3px solid var(--gold);border-radius:50%;display:inline-block}.mark:before{content:"";position:absolute;left:11px;top:7px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--gold2)}.mark:after{content:"";position:absolute;width:12px;height:4px;right:-7px;bottom:0;background:var(--gold);transform:rotate(45deg);border-radius:4px}.brand a{color:var(--muted);text-decoration:none}.player{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;place-items:center;box-shadow:0 20px 70px #0008}.player video{width:100%;height:100%;display:block;background:#000}.state{text-align:center;padding:24px;color:var(--muted)}.state strong{display:block;color:#fff;margin-bottom:7px}.spinner{width:38px;height:38px;border:4px solid #ffffff18;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.panel{margin-top:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.status{color:var(--muted);line-height:1.7}.servers{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.servers button,.retry{border:1px solid var(--line);background:#1d2a40;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.servers button.active{background:var(--gold);color:#171006}.retry{margin-top:12px;background:var(--gold);color:#171006}.error{color:#ffd1d4}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><strong><span class="mark"></span><span>القحطاني TV</span></strong><a href="./">العودة للمباريات</a></div>
  <div id="player" class="player"><div class="state"><div class="spinner"></div><strong>جارٍ تجهيز البث</strong>يتم فحص الخوادم دون كشف المصدر الأصلي.</div></div>
  <div class="panel"><div id="status" class="status">جارٍ تحميل خوادم المباراة…</div><div id="servers" class="servers"></div></div>
</main>
<script type="module">
import { getMatchServers, getMatchPlayback, ProviderEndpoints } from './web/core/api-client.js';
const matchRef=new URLSearchParams(location.search).get('match')||'';
const player=document.getElementById('player'),statusEl=document.getElementById('status'),serversEl=document.getElementById('servers');
let hls=null,generation=0,servers=[],buttons=[],activeIndex=-1,failoverBusy=false;
function stop(){generation++;if(hls){hls.destroy();hls=null}player.innerHTML=''}
function fail(message){stop();player.innerHTML='<div class="state error"><strong>تعذر تشغيل المباراة</strong>'+message+'<br><button id="retry" class="retry">إعادة المحاولة</button></div>';document.getElementById('retry')?.addEventListener('click',load);statusEl.textContent=message}
async function tryNext(reason){
 if(failoverBusy)return;failoverBusy=true;
 const next=activeIndex+1;
 if(next<servers.length){statusEl.textContent=(reason?reason+' ':'')+'جارٍ تجربة السيرفر التالي تلقائيًا…';failoverBusy=false;await playServer(next);return}
 failoverBusy=false;fail('تم فحص جميع خوادم المباراة ولم يرجع أي منها بثًا قابلًا للتشغيل حاليًا.');
}
function videoFor(url,type,name,index){
 stop();const current=generation;const video=document.createElement('video');video.controls=true;video.autoplay=true;video.playsInline=true;video.preload='metadata';video.setAttribute('webkit-playsinline','');player.appendChild(video);
 let started=false;const timer=setTimeout(()=>{if(!started&&current===generation)tryNext('انتهت مهلة بدء السيرفر.')},12000);
 const onFailure=message=>{if(current!==generation||started)return;clearTimeout(timer);statusEl.textContent=message;tryNext(message)};
 video.addEventListener('playing',()=>{started=true;clearTimeout(timer);statusEl.textContent='يعمل الآن: '+name},{once:true});
 video.addEventListener('error',()=>onFailure('فشل هذا السيرفر.'));
 if(type==='m3u8'){
   if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=url;
   else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal&&current===generation)onFailure('تعذر تشغيل بث HLS من هذا السيرفر.')})}
   else video.src=url;
 }else{video.src=url}
 video.play().catch(()=>{if(current===generation)statusEl.textContent='البث جاهز. اضغط تشغيل، وإن لم يبدأ سنجرّب السيرفر التالي تلقائيًا.'});
}
async function playServer(index){
 if(index<0||index>=servers.length)return;activeIndex=index;const server=servers[index];buttons.forEach((b,i)=>b.classList.toggle('active',i===index));statusEl.textContent='جارٍ فحص '+server.name+'…';
 try{const result=await getMatchPlayback(server.ref),data=result?.data?.data;if(!data?.media_path)throw new Error('NO_MEDIA');const url=ProviderEndpoints.backend+data.media_path;videoFor(url,data.media_type||server.type||'stream',data.server_name||server.name,index)}catch{await tryNext('تعذر استخراج البث من '+server.name+'.')}
}
async function load(){
 if(!matchRef){fail('مرجع المباراة غير صالح.');return}
 stop();servers=[];buttons=[];activeIndex=-1;failoverBusy=false;player.innerHTML='<div class="state"><div class="spinner"></div><strong>جارٍ تجهيز البث</strong>يتم فحص الخوادم دون كشف المصدر الأصلي.</div>';serversEl.innerHTML='';statusEl.textContent='جارٍ تحميل خوادم المباراة…';
 try{const result=await getMatchServers(matchRef);servers=result?.data?.data;if(!Array.isArray(servers)||!servers.length){fail('لا يوجد مصدر بث متاح لهذه المباراة حاليًا.');return}buttons=servers.map((server,i)=>{const b=document.createElement('button');b.textContent=server.name||('سيرفر '+(i+1));b.onclick=()=>playServer(i);serversEl.appendChild(b);return b});await playServer(0)}catch{fail('تعذر الوصول إلى خوادم المباراة حاليًا.')}
}
load();
</script>
</body>
</html>
