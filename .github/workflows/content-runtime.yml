name: Content runtime

on:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate runtime module syntax
        run: |
          node --check server/content-runtime.mjs
          node --check server/content-runtime-service.mjs
          node --check server/app.mjs
      - name: Validate runtime regression test syntax
        run: |
          node --check scripts/content_runtime_test.mjs
          node --check scripts/content_runtime_service_test.mjs
          node --check scripts/runtime_http_test.mjs
      - name: Run content runtime regressions
        run: |
          node scripts/content_runtime_test.mjs
          node scripts/content_runtime_service_test.mjs
          node scripts/runtime_http_test.mjs
