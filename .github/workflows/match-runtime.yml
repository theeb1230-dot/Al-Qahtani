name: Match runtime

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/match_runtime_test.mjs'
      - '.github/workflows/match-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/match_runtime_test.mjs'
      - '.github/workflows/match-runtime.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/match_runtime_test.mjs
