name: Web smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect original Basri archive contract
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('albasritv.github.io-main.zip') as z:
              name='albasritv.github.io-main/albasri-cinema.html'
              text=z.read(name).decode('utf-8','ignore')
              for needle in ['const ALLOWED_HOST','async function getApiSession','fetch(API_URL + "session"']:
                  i=text.find(needle)
                  print('\n===',needle,'===')
                  print(text[max(0,i-250):i+1500] if i>=0 else 'NOT FOUND')
          PY

      - name: Inspect original cinema source structure
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          curl -L --max-time 25 -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -o /tmp/basri-source.html -w 'source_http=%{http_code} final=%{url_effective} bytes=%{size_download}\n' 'https://akwam.ss/series?section=30'
          python - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/basri-source.html')
          if not p.exists():
              print('source body unavailable'); raise SystemExit(0)
          text=p.read_text('utf-8','ignore')
          title=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
          print('title=',title.group(1).strip() if title else '')
          first=re.search(r'https://akwam\.ss/series/[^"\']+',text,re.I)
          if first:
              i=first.start(); print('CARD_CONTEXT_START'); print(text[max(0,i-1400):i+2600]); print('CARD_CONTEXT_END')
          for pat in [r'<form[^>]+action=["\']([^"\']+)["\'][^>]*>',r'<input[^>]+name=["\']([^"\']+)["\'][^>]*placeholder=["\']([^"\']*)["\']']:
              print('FORM_MATCHES=',re.findall(pat,text,re.I)[:10])
          PY
          FIRST=$(python - <<'PY'
          import re,pathlib
          t=pathlib.Path('/tmp/basri-source.html').read_text('utf-8','ignore')
          m=re.search(r'https://akwam\.ss/series/[^"\']+',t,re.I)
          print(m.group(0) if m else '')
          PY
          )
          if [ -n "$FIRST" ]; then
            curl -L --max-time 25 -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -o /tmp/basri-detail.html -w 'detail_http=%{http_code} final=%{url_effective} bytes=%{size_download}\n' "$FIRST"
            python - <<'PY'
          import re,pathlib
          p=pathlib.Path('/tmp/basri-detail.html')
          if not p.exists(): raise SystemExit(0)
          t=p.read_text('utf-8','ignore')
          for needle in ['episode','watch','download','btn-watch','btn-download','watch-btn','download-btn']:
              hits=[m.start() for m in re.finditer(needle,t,re.I)]
              if hits:
                  i=hits[0]; print('\nDETAIL_CONTEXT',needle); print(t[max(0,i-900):i+2200])
          hrefs=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\']',t,re.I):
              h=m.group(1)
              if any(x in h.lower() for x in ['episode','watch','download']): hrefs.append(h)
              if len(hrefs)>=20: break
          print('DETAIL_ACTION_HREFS=',hrefs)
          PY
          fi
          exit 0

      - name: Reject ad-network runtime references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude='AUTONOMOUS_DEVELOPMENT_STATE.md' --exclude='prepare_clean_web.py' 'highperformanceformat\.com|effectivecpmnetwork\.com' .; then
            echo "Forbidden ad-network reference found"
            exit 1
          fi

      - name: Reject obfuscated news bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ -f news.html ] && grep -nE 'document\.write\(|Uint8Array\.from\(atob' news.html; then
            echo "news.html still contains the legacy obfuscated bootstrap"
            exit 1
          fi

      - name: Guard web-native player
        shell: bash
        run: |
          set -euo pipefail
          test -f Player.html
          grep -q "hls.js" Player.html
          if grep -n 'com\.bsr\.player\.pro' Player.html; then
            echo "Player.html must not open the legacy Android package"
            exit 1
          fi

      - name: Keep Worker endpoints out of UI files
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'https://[^"[:space:]]*workers\.dev' index.html news.html albasri-cinema.html Player.html bsr-Player.html basrimatches.html; then
            echo "Worker endpoint leaked into UI file; keep it in provider/backend code"
            exit 1
          fi

      - name: Reject cross-project Theeb integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude='AUTONOMOUS_DEVELOPMENT_STATE.md' --exclude='web-smoke.yml' 'theeb-arab-api|THEEB_SERVICE_TOKEN|akwam-indexer|server/theeb-fetch|theeb:canonical:|theeb:discover:|theeb:episode:' .; then
            echo "Al-Qahtani must remain independent from Theeb/Akwam project integration"
            exit 1
          fi

      - name: Require migrated web surface
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html Player.html news.html albasri-cinema.html basrimatches.html bsr-Player.html sitemap.xml; do
            test -s "$f" || { echo "Missing required web file: $f"; exit 1; }
          done

      - name: Validate provider and backend syntax
        run: |
          node --check web/core/providers.js
          node --check web/core/contracts.js
          node --check web/core/api-client.js
          node --check web/core/catalog-config.js
          node --check scripts/live_provider_smoke.mjs
          node --check server/app.mjs
          node --check server/index.mjs
          node --check scripts/local_backend_smoke.mjs
          node --check scripts/remote_runtime_smoke.mjs

      - name: Guard provider module retry
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'new Headers(init.headers' web/core/providers.js
          grep -q "retryMatches.*class=.retry" index.html
          if grep -q 'onclick="load()"' index.html; then
            echo "Inline retry cannot call module-scoped load()"
            exit 1
          fi

      - name: Validate migration tooling
        run: python -m py_compile scripts/prepare_clean_web.py
