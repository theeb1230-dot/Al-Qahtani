name: Trusted download filename

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  filename:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate trusted download filename sanitization
        run: node scripts/download_filename_test.mjs
