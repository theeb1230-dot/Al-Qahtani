<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>Al-Qahtani</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2c;--panel2:#132238;--text:#fff;--muted:#9db0c4;--accent:#1cc8ee;--danger:#ff5a6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#153253 0,transparent 35%),var(--bg);color:var(--text);font-family:Cairo,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#07111fe8;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff15}
.wrap{max-width:980px;margin:auto;padding:16px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand strong{font-size:1.1rem}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;background:var(--panel);padding:8px 11px;border-radius:10px;font-size:.85rem}
.hero{padding:28px 0 14px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,6vw,2.7rem)}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;gap:12px}.card{background:linear-gradient(145deg,#ffffff08,#ffffff02),var(--panel);border:1px solid #ffffff12;border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:8px;cursor:pointer}
.team{text-align:center}.team img{width:58px;height:58px;object-fit:contain}.team b{display:block;margin-top:6px}.center{text-align:center}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#ffffff10;color:var(--muted);font-size:.75rem}.live{color:#ff8b96}.time{font-weight:800;margin-top:8px}
.state{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border-radius:18px}.retry{margin-top:12px;border:0;background:var(--accent);color:#03141a;padding:10px 14px;border-radius:10px;font-weight:800}
@media(max-width:620px){.card{grid-template-columns:1fr 92px 1fr}.team img{width:48px;height:48px}.team b{font-size:.85rem}}
</style>
</head>
<body>
<header><div class="wrap brand"><strong>Al-Qahtani</strong><nav class="nav"><a href="./">المباريات</a><a href="albasri-cinema.html">الأفلام والمسلسلات</a><a href="news.html">الأخبار</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>مباريات اليوم</h1><p>نسخة ويب مستقلة بدون إعلانات أو إجبار على فتح تطبيق خارجي.</p></section>
<div id="list" class="grid"><div class="state">جارٍ تحميل المباريات…</div></div>
</main>
<script type="module">
import { getMatches, getMatchServers } from './web/core/api-client.js';
const list=document.getElementById('list');
const cleanImg=u=>{if(!u)return '';try{return new URL(u,location.href).href}catch{return u}};
const fmt=t=>{if(!t)return '';const m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return t;let h=+m[1],ap=h>=12?'م':'ص';h=h%12||12;return h+':'+m[2]+' '+ap};
function card(m){
 const d=document.createElement('div');d.className='card';
 const score=(m.team1?.goals||0)+' - '+(m.team2?.goals||0);
 const live=m.priority===1, ended=m.priority===3;
 const label=live?'جاري الآن':ended?'انتهت':'لم تبدأ';
 const center=live||ended?score:fmt(m.time);
 d.innerHTML='<div class="team"><img src="'+cleanImg(m.team1?.logo)+'" alt=""><b>'+String(m.team1?.name||'')+'</b></div><div class="center"><span class="pill '+(live?'live':'')+'">'+label+'</span><div class="time">'+center+'</div></div><div class="team"><img src="'+cleanImg(m.team2?.logo)+'" alt=""><b>'+String(m.team2?.name||'')+'</b></div>';
 d.onclick=()=>openMatch(m);
 return d;
}
async function openMatch(m){
 if(m.priority===2||m.priority===3){location.href='Player.html';return}
 try{
   const result=await getMatchServers(m.link); const j=result.data;
   if(j?.success&&Array.isArray(j.servers)&&j.servers.length){
     const payload={servers:j.servers};
     const bytes=new TextEncoder().encode(JSON.stringify(payload));let s='';bytes.forEach(b=>s+=String.fromCharCode(b));
     const b64=btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
     location.href='Player.html?intent='+encodeURIComponent('legacy://player?data='+b64);
     return;
   }
 }catch(e){}
 location.href='Player.html';
}
async function load(){
 list.innerHTML='<div class="state">جارٍ تحميل المباريات…</div>';
 try{
  const result=await getMatches(); const j=result.data;
  if(!j?.success||!Array.isArray(j.data))throw new Error('payload');
  list.innerHTML='';if(!j.data.length){list.innerHTML='<div class="state">لا توجد مباريات اليوم.</div>';return}
  j.data.forEach(m=>list.appendChild(card(m)));
 }catch(e){list.innerHTML='<div class="state">تعذر جلب المباريات حاليًا.<br><button class="retry" onclick="load()">إعادة المحاولة</button></div>'}
}
load();
</script>
</body>
</html>
