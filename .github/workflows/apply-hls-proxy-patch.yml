name: Apply HLS proxy patch

on:
  push:
    branches:
      - fix/hls-media-proxy-82

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hls-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node scripts/apply_hls_proxy_patch.mjs
      - name: Validate patched runtime
        run: npm run check
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.mjs flutter_app/pubspec.yaml package.json
          git commit -m "Proxy HLS child resources through opaque refs [hls-patch]"
          git push origin HEAD:fix/hls-media-proxy-82
